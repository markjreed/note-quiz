<!DOCTYPE html>
<html>
 <head>
  <meta charset="UTF-8">
  <title>Note Quiz</title>
  <script src="node_modules/vexflow/build/cjs/vexflow.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      color: #17283c;
    }
    #output {
      width: max-content;
      margin-bottom: 0.75rem;
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    label, button, select {
      font: inherit;
      font-size: 1rem;
    }
    select, button {
      padding: 0.45rem 0.75rem;
    }
    button {
      cursor: pointer;
    }
  </style>
 </head>
 <body>
  <h1>Note Quiz</h1>
  <h2>Play the randomly-selected note(s).</h2>
  <h3>
   <label>
    Instrument
    <select id="instrument"></select>
   </label>
   <label>
    Range
    <select id="range">
     <option value="full">Full</option>
     <option value="comfortable">Comfortable</option>
     <option value="custom">Custom</option>
    </select>
   </label>
   <span id="custom-range">
    <select id="low" aria-label="Lowest note"></select>
    to
    <select id="high" aria-label="Highest note"></select>
   </span>
  </h3>
  <div id="output"></div>
  <div class="controls">
   <label>
    Mode
    <select id="mode">
     <option value="one">One note</option>
     <option value="two">Two notes</option>
    </select>
   </label>
   <button id="next" type="button">New note</button>
   <button id="play" type="button">Play</button>
  </div>
  <script>
    const SPELLING = ['c', 'db', 'd', 'eb', 'e', 'f', 'gb', 'g', 'ab', 'a', 'bb', 'b'];
    const NATURALS = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };

    // 'e2' -> 40, 'bb3' -> 58, 'f#3' -> 54 (C4 = 60).
    function noteToMidi(name) {
      const match = name.toLowerCase().match(/^([a-g])(bb|##|b|#)?(\d)$/);
      if (!match) throw new Error('Bad note name: ' + name);
      const shift = { '': 0, '#': 1, '##': 2, b: -1, bb: -2 }[match[2] || ''];
      return NATURALS[match[1]] + shift + (Number(match[3]) + 1) * 12;
    }

    // low/high are the full range and comfortLow/comfortHigh the comfortable
    // range, all as written pitches. transpose is semitones from written to
    // sounding pitch (for future audio).
    const INSTRUMENTS = [
      {
        name: 'Baritone Horn (Bass Clef)',
        clef: 'bass',
        low: noteToMidi('e2'),
        high: noteToMidi('g4'),
        comfortLow: noteToMidi('a2'),
        comfortHigh: noteToMidi('d4'),
        transpose: 0,
      },
      {
        name: 'Baritone Horn (Treble Clef)',
        clef: 'treble',
        low: noteToMidi('f3'),
        high: noteToMidi('a5'),
        comfortLow: noteToMidi('b3'),
        comfortHigh: noteToMidi('e5'),
        transpose: -14,
      },
      {
        name: 'Flute',
        clef: 'treble',
        low: noteToMidi('c4'),
        high: noteToMidi('d7'),
        comfortLow: noteToMidi('c4'),
        comfortHigh: noteToMidi('a6'),
        transpose: 0,
      },
      {
        name: 'Guitar',
        clef: 'treble',
        low: noteToMidi('e3'),
        high: noteToMidi('d7'),
        comfortLow: noteToMidi('e3'),
        comfortHigh: noteToMidi('e6'),
        transpose: -12,
      },
      {
        name: 'Trombone',
        clef: 'bass',
        low: noteToMidi('e2'),
        high: noteToMidi('g4'),
        comfortLow: noteToMidi('a2'),
        comfortHigh: noteToMidi('d4'),
        transpose: 0,
      },
      {
        name: 'Ukulele',
        clef: 'treble',
        low: noteToMidi('g3'),
        high: noteToMidi('c6'),
        comfortLow: noteToMidi('c4'),
        comfortHigh: noteToMidi('e5'),
        transpose: 0,
      },
      {
        name: 'Viola',
        clef: 'alto',
        low: noteToMidi('c3'),
        high: noteToMidi('e6'),
        comfortLow: noteToMidi('c3'),
        comfortHigh: noteToMidi('a5'),
        transpose: 0,
      },
    ];
    let instrument = INSTRUMENTS[0];

    function midiToName(midi) {
      return SPELLING[midi % 12] + (Math.floor(midi / 12) - 1);
    }

    // The endpoint dropdowns always show the active range.
    function activeRange() {
      return { low: Number(lowSelect.value), high: Number(highSelect.value) };
    }

    // Set the endpoint dropdowns to match the Full or Comfortable preset.
    function applyPreset() {
      if (rangeSelect.value === 'comfortable') {
        lowSelect.value = instrument.comfortLow;
        highSelect.value = instrument.comfortHigh;
      } else if (rangeSelect.value === 'full') {
        lowSelect.value = instrument.low;
        highSelect.value = instrument.high;
      }
    }

    function randomMidi() {
      const { low, high } = activeRange();
      return low + Math.floor(Math.random() * (high - low + 1));
    }

    function parseNote(name) {
      const match = name.match(/^([a-g])(bb|##|b|#|n)?(\d)$/);
      return {
        key: match[1] + (match[2] || '') + '/' + match[3],
        accidental: match[2] || '',
      };
    }

    function sameExercise(a, b) {
      if (!a || !b || a.mode !== b.mode) return false;
      if (a.mode === 'one') return a.midi === b.midi;
      return a.start === b.start && a.end === b.end;
    }

    function randomPair() {
      const start = randomMidi();
      let end = start;
      while (end === start) end = randomMidi();
      return { start, end };
    }

    function randomExercise(mode, except) {
      let next;
      do {
        next = mode === 'one'
          ? { mode: 'one', midi: randomMidi() }
          : { mode: 'two', ...randomPair() };
      } while (sameExercise(next, except));
      return next;
    }

    function makeStaveNote(midi, duration) {
      const parsed = parseNote(midiToName(midi));
      const note = new VexFlow.StaveNote({
        keys: [parsed.key],
        duration: duration,
        clef: instrument.clef,
        autoStem: duration !== 'w',
      });
      if (parsed.accidental) {
        note.addModifier(new VexFlow.Accidental(parsed.accidental), 0);
      }
      return note;
    }

    function exerciseMidis(exercise) {
      return exercise.mode === 'two'
        ? [exercise.start, exercise.end, exercise.start, exercise.end]
        : [exercise.midi];
    }

    const BPM = 80;
    let audioContext = null;

    // Plays the written notes at their sounding pitch (written + transpose).
    function playExercise(exercise) {
      audioContext = audioContext || new AudioContext();
      if (audioContext.state === 'suspended') audioContext.resume();
      const midis = exerciseMidis(exercise);
      const beats = 4 / midis.length;
      const seconds = beats * 60 / BPM;
      const t0 = audioContext.currentTime + 0.05;
      midis.forEach((midi, i) => {
        const sounding = midi + instrument.transpose;
        const freq = 440 * Math.pow(2, (sounding - 69) / 12);
        const start = t0 + i * seconds;
        const stop = start + seconds;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.3, start + 0.02);
        gain.gain.setValueAtTime(0.3, stop - 0.08);
        gain.gain.linearRampToValueAtTime(0, stop - 0.02);
        osc.connect(gain).connect(audioContext.destination);
        osc.start(start);
        osc.stop(stop);
      });
    }

    function show(exercise) {
      const output = document.getElementById('output');
      output.replaceChildren();
      const two = exercise.mode === 'two';
      const width = two ? 480 : 280;
      const height = 180;
      const renderer = new VexFlow.Renderer(output, VexFlow.Renderer.Backends.SVG);
      renderer.resize(width, height);
      const context = renderer.getContext();

      const stave = new VexFlow.Stave(8, 62, width - 16);
      stave.addClef(instrument.clef);
      if (two) stave.addTimeSignature('4/4');
      stave.setContext(context).draw();

      const midis = exerciseMidis(exercise);
      const notes = midis.map((midi) => makeStaveNote(midi, two ? 'q' : 'w'));
      const voice = new VexFlow.Voice({ numBeats: 4, beatValue: 4 }).setStave(stave);
      notes.forEach((note) => {
        note.setStave(stave);
        voice.addTickable(note);
      });

      const formatter = new VexFlow.Formatter().joinVoices([voice]);
      const start = stave.getNoteStartX();
      const end = stave.getNoteEndX();
      formatter.format([voice], end - start);
      if (!two) {
        // Center the whole note, then format again so its accidental moves with it.
        const left = Math.max(start, (start + end - notes[0].getWidth()) / 2);
        stave.setNoteStartX(left);
        formatter.format([voice], Math.max(notes[0].getWidth(), end - left));
      }
      voice.draw(context, stave);
    }

    const modeSelect = document.getElementById('mode');
    const instrumentSelect = document.getElementById('instrument');
    INSTRUMENTS.forEach((inst, i) => {
      instrumentSelect.add(new Option(inst.name, i));
    });
    const rangeSelect = document.getElementById('range');
    const lowSelect = document.getElementById('low');
    const highSelect = document.getElementById('high');

    function noteLabel(midi) {
      const name = midiToName(midi);
      return name[0].toUpperCase() + name.slice(1).replace('b', '\u266d');
    }

    // Offer every note of the instrument's full range as a custom endpoint.
    function fillCustomRange() {
      lowSelect.replaceChildren();
      highSelect.replaceChildren();
      for (let m = instrument.low; m <= instrument.high; m++) {
        lowSelect.add(new Option(noteLabel(m), m));
        highSelect.add(new Option(noteLabel(m), m));
      }
      applyPreset();
    }

    // Keep the custom range at least two notes wide (two-note mode needs it).
    function normalizeCustomRange(changed) {
      let lo = Number(lowSelect.value);
      let hi = Number(highSelect.value);
      if (lo < hi) return;
      if (changed === 'low') {
        if (lo >= instrument.high) {
          lo = instrument.high - 1;
          lowSelect.value = lo;
        }
        highSelect.value = lo + 1;
      } else {
        if (hi <= instrument.low) {
          hi = instrument.low + 1;
          highSelect.value = hi;
        }
        lowSelect.value = hi - 1;
      }
    }

    fillCustomRange();
    rangeSelect.addEventListener('change', () => {
      applyPreset();
      current = randomExercise(modeSelect.value);
      show(current);
    });
    [['low', lowSelect], ['high', highSelect]].forEach(([which, select]) => {
      select.addEventListener('change', () => {
        rangeSelect.value = 'custom';
        normalizeCustomRange(which);
        current = randomExercise(modeSelect.value);
        show(current);
      });
    });

    instrumentSelect.addEventListener('change', () => {
      instrument = INSTRUMENTS[Number(instrumentSelect.value)];
      rangeSelect.value = 'full';
      fillCustomRange();
      current = randomExercise(modeSelect.value);
      show(current);
    });
    const nextButton = document.getElementById('next');
    let current = randomExercise(modeSelect.value);

    function refreshLabel() {
      nextButton.textContent = modeSelect.value === 'one' ? 'New note' : 'New notes';
    }

    refreshLabel();
    show(current);
    modeSelect.addEventListener('change', () => {
      current = randomExercise(modeSelect.value);
      refreshLabel();
      show(current);
    });
    document.getElementById('play').addEventListener('click', () => {
      playExercise(current);
    });
    nextButton.addEventListener('click', () => {
      current = randomExercise(modeSelect.value, current);
      show(current);
    });
  </script>
 </body>
</html>
